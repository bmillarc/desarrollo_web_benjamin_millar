<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
	<title>Form Validation</title>
    <link rel="stylesheet" type="text/css" href="../css/form.css">
</head>
<body>
    
        
    <div class="main-container">
        <div id="val-box" hidden>
            <h2 id="val-msg"></h2>
            <ul id="val-list"></ul>
        </div>
        
        <form name="myForm" method="post" enctype="multipart/form-data">
            
            <p>Donde?</p>

            <label for="select-region">Region</label>
            <select name="select-region" id="select-region" required>
                <option value="">Seleccione una Region</option>
            </select><br>

            <label for="select-comuna">Comuna</label>
            <select name="select-comuna" id="select-comuna" required>
                <option value="">Seleccione una comuna</option>
            </select><br>

            <label for="sector" style="display: none;">Sector</label>
            <textarea name="comments" id="comments" rows="1" cols="100" style="display: none;"></textarea><br>

            <p>Quien organiza?</p>

            <label for="nombre">Nombre</label>
            <input type="text" name="nombre" id="nombre" required><br>
            
            <label for="email">Email</label>
            <input type="email" name="email" id="email" required><br>

            <label for="phone">Phone</label>
            <input type="tel" name="phone" id="phone" required><br>
            

            <label for="select-contacto">Forma de contacto</label>
            <select name="select-contacto" id="select-contacto">
                <option value="">Seleccione una forma de contacto</option>
            </select><br>

            <label for="select-contacto" style="display: none;">Sector</label>
            <textarea name="contacto" id="contacto" rows="1" cols="50" style="display: none;"></textarea><br>

            <p>Cuando y de que trata?</p>

            <label for="horai">Hora de Inicio</label>
            <input type="datetime-local" name="horai" id="horai" required><br>
            
            <label for="horaf">Hora de termino</label>
            <input type="datetime-local" name="horaf" id="horaf"><br>

            <label for="tema">Tema</label>
            <select name="select-tema" id="select-tema" required>
                <option value="">Seleccione un tema</option>
            </select><br>

            <label for="descripcion">Descripcion</label>
            <textarea name="descripcion" id="descripcion" rows="10" cols="50"></textarea><br>
            
            <label for="files">Imagenes</label>
            <input type="file" name="files" id="files" multiple accept="image/*,.pdf" required><br>
            
            <button id="submit-btn" type="button">Enviar</button>
            
            
        </form>
    </div>
    
    
    <script src="../js/select.js"></script>
    <script src="../js/valid.js"></script>
</body>
</html>
